name: Build and Publish Docker Images

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: unstable-slim
            tags: unstable
            debian-version: unstable
          - base: trixie-slim
            tags: trixie,1.4,latest
            debian-version: trixie
          - base: bookworm-slim
            tags: bookworm,1.2,oldstable
            debian-version: bookworm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare tags
        id: prepare-tags
        run: |
          # Split comma-separated tags and create proper tag list
          TAGS="${{ matrix.tags }}"
          DOCKERHUB_TAGS=""
          GHCR_TAGS=""

          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            tag=$(echo "$tag" | xargs) # trim whitespace
            DOCKERHUB_TAGS="${DOCKERHUB_TAGS}${{ github.repository }}:${tag},"
            GHCR_TAGS="${GHCR_TAGS}ghcr.io/${{ github.repository }}:${tag},"
          done

          # Remove trailing comma
          DOCKERHUB_TAGS=${DOCKERHUB_TAGS%,}
          GHCR_TAGS=${GHCR_TAGS%,}

          # Combine all tags
          ALL_TAGS="${DOCKERHUB_TAGS},${GHCR_TAGS}"

          echo "tags=${ALL_TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${ALL_TAGS}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64/v8
          build-args: |
            BASE_IMAGE=debian:${{ matrix.base }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prepare-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
