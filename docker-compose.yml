version: '3'
services:
 borgserver:
  image: nold360/borgserver
  #build: .
  volumes:
   - ./backup:/backup
   - ./sshkeys:/sshkeys
  ports:
   - "2222:22"
  environment:
  # Additional Arguments, see https://borgbackup.readthedocs.io/en/stable/usage/serve.html
   BORG_SERVE_ARGS: ""

   # If set to "yes", only the BORG_ADMIN
   # can delete/prune the other clients archives/repos
   BORG_APPEND_ONLY: "no"

   # Filename of Admins SSH-Key; has full access to all repos
   BORG_ADMIN: ""

   # Automatic Prune Configuration
   # Cron schedule for automatic pruning (default: daily at 3 AM)
   # Set BORG_PRUNE_ENABLED=yes to enable automatic pruning
   BORG_PRUNE_SCHEDULE: "0 3 * * *"

   # Default prune retention policy (used if no prune.conf file exists)
   # Set to -1 to disable a specific retention period
   BORG_PRUNE_KEEP_DAILY: "7"
   BORG_PRUNE_KEEP_WEEKLY: "4"
   BORG_PRUNE_KEEP_MONTHLY: "-1"
   BORG_PRUNE_KEEP_YEARLY: "-1"
  restart: unless-stopped
